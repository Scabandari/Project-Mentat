name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mentat
          POSTGRES_PASSWORD: mentat
          POSTGRES_DB: mentat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mentat" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://mentat:mentat@localhost:5432/mentat
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest -q
      - name: OpenAPI client is up to date
        run: |
          uv run python -m app.scripts.export_openapi > /tmp/openapi.json
          diff -q /tmp/openapi.json ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm vitest run
      - run: pnpm build

  stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Prod stack smoke test
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
          curl -fsS http://localhost:8473/api/v1/health
          curl -fsS http://localhost:8473/ | grep -q '<title>Mentat</title>'
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs
