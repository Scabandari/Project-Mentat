  # ---------------------------------------------------------------- 0
  - slug: hand-basics
    section: 0
    name: Hand Basics
    description: Hand rankings, kickers, reading the board, the nuts.
    lesson_md: |
      ## How a hand is made
      You get **2 hole cards**; the board shows up to **5 community cards**. Your hand is the **best 5 cards out of those 7**. You can use both hole cards, one, or none ("playing the board").

      ## Hand rankings, best to worst
      | # | Hand | Example |
      |---|---|---|
      | 1 | Straight flush | 9♠ 8♠ 7♠ 6♠ 5♠ |
      | 2 | Four of a kind | Q Q Q Q 4 |
      | 3 | Full house | J J J 3 3 |
      | 4 | Flush | A♦ J♦ 8♦ 5♦ 2♦ |
      | 5 | Straight | T 9 8 7 6 |
      | 6 | Three of a kind | 7 7 7 K 2 |
      | 7 | Two pair | A A 9 9 4 |
      | 8 | One pair | K K Q 8 3 |
      | 9 | High card | A J 8 6 2 |

      A royal flush is just the highest straight flush. The ace plays high or low: **A-2-3-4-5** (the wheel) is the lowest straight.

      ## Kickers
      When two players have the same pair, the next-highest cards in their best five (the **kickers**) decide. If the best fives are identical, the pot is **split**.

      ## Reading the board
      - **Flush possible?** Three cards of one suit on the board.
      - **Straight possible?** Three board cards within any five-rank window.
      - **Full house possible?** The board is paired.
      - **The nuts** is the best possible hand on this board. Check from the top: straight flush, quads, full house, flush, straight.

      **Shortcut:** before judging your hand, ask what the board makes possible.
    cards:
