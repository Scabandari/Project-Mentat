      - {slug: fact-dominated, kind: static, target_ms: 6000, front_md: "**Dominated hand** (e.g. AK vs AQ): equity?", back_md: "**≈ 70–75 / 25–30** for the dominating hand."}
      - {slug: fact-overs-vs-unders, kind: static, target_ms: 6000, front_md: "**Two overcards vs. two undercards** (e.g. AK vs 87): equity?", back_md: "**≈ 60/40** for the overcards."}
