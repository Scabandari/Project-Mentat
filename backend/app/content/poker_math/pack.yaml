      - {slug: fact-outs-oesd, kind: static, target_ms: 5000, front_md: "Outs for an **open-ended straight draw**?", back_md: "**8**: 4 cards at each end."}
      - {slug: fact-outs-gutshot, kind: static, target_ms: 5000, front_md: "Outs for a **gutshot** straight draw?", back_md: "**4**"}
      - {slug: fact-outs-overcards, kind: static, target_ms: 5000, front_md: "Outs for **two overcards** (to pair one)?", back_md: "**6**: 3 + 3. Often dirty."}
      - {slug: fact-outs-pair-improve, kind: static, target_ms: 5000, front_md: "You have **one pair** (pocket cards unpaired, one pairs the board). Outs to two pair or trips?", back_md: "**5**: 2 to trips + 3 to pair your kicker."}
      - {slug: fact-outs-set-boat, kind: static, target_ms: 6000, front_md: "You flop a **set**. Outs to a full house or better on the turn?", back_md: "**7**: 3 + 3 pairing the board, 1 for quads."}
      - {slug: fact-outs-combo-fd-oesd, kind: static, target_ms: 6000, front_md: "Outs for a **flush draw + open-ender**?", back_md: "**15**: 9 + 8 − 2 overlapping cards."}
      - {slug: fact-outs-combo-fd-gut, kind: static, target_ms: 6000, front_md: "Outs for a **flush draw + gutshot**?", back_md: "**12**: 9 + 4 − 1 overlapping card."}
      - slug: fact-rule-2-4
        kind: static
        target_ms: 8000
        front_md: State the **rule of 2 and 4**.
        back_md: |
          Equity ≈ outs × **4** on the flop (two cards to come, if you'll see both).
          Equity ≈ outs × **2** on the turn (one card to come).
          With more than 8 outs on the flop, subtract (outs − 8): 15 outs → 60 − 7 = **53%** (exact 54%).
      - {slug: fact-odds-fd, kind: static, target_ms: 6000, front_md: "**Flush draw** on the flop: equity by the river? By the turn?", back_md: "**35%** by the river · **19%** next card."}
      - {slug: fact-odds-oesd, kind: static, target_ms: 6000, front_md: "**Open-ender** on the flop: equity by the river? By the turn?", back_md: "**32%** by the river · **17%** next card."}
      - {slug: fact-odds-gutshot, kind: static, target_ms: 6000, front_md: "**Gutshot** on the flop: equity by the river? By the turn?", back_md: "**17%** by the river · **9%** next card."}
      - {slug: fact-odds-backdoor-flush, kind: static, target_ms: 6000, front_md: "**Backdoor flush draw** (3 to a flush on the flop): chance to complete?", back_md: "**≈ 4%**: needs both turn and river."}

  # ---------------------------------------------------------------- 4
  - slug: pot-odds
    section: 4
    name: Pot Odds
    description: Equity needed vs. equity you have.
    lesson_md: |
      ## The question
      Is the equity you **have** bigger than the equity you **need**?

      ## Equity you need
      **call ÷ final pot**, where the final pot is pot + villain's bet + your call.

      Pot $100, villain bets $50: you call $50 to win $200 → **25%**.

      For standard sizes, read it off the table: ½ pot = 25%, pot = 33%.

      ## Equity you have
      Count outs, then:
      - one card to come (villain can bet again): outs × 2
      - two cards, all-in: outs × 4

      ## Decide
      Call if have ≥ need. If it's close, implied odds (money you win later when you hit) can justify a call; that's section 7.

      **Worked example:** Flop flush draw, villain bets ½ pot. Need 25%, have ≈ 9 × 2 = 18–19%. Direct odds say **fold** unless implied odds make up the gap.

      **Multiway:** every caller ahead of you adds money to the pot, so your price gets better: bet B into P with one caller needs B / (P + 3B).
    cards:
      - {slug: pot-odds-required, kind: generator, answer_type: bucket, generator_key: pot_odds_required, target_ms: 10000}
      - {slug: pot-odds-vs-draw, kind: generator, answer_type: choice, generator_key: pot_odds_vs_draw, target_ms: 15000}
      - {slug: call-or-fold-draw, kind: generator, answer_type: action, generator_key: call_or_fold_draw, target_ms: 25000}
      - {slug: pot-odds-multiway, kind: generator, answer_type: bucket, generator_key: pot_odds_multiway, target_ms: 20000}
      - slug: fact-pot-odds-method
        kind: static
        target_ms: 10000
        front_md: "What's the 3-step check before calling with a draw?"
        back_md: |
          1. **Required equity** = call / (pot after you call).
          2. **Your equity** ≈ outs × 2 (one card) or × 4 (two cards, all-in).
          3. **Call** if your equity ≥ required (plus implied odds); otherwise fold.
      - slug: fact-pot-odds-one-card
        kind: static
        target_ms: 8000
        front_md: You have a flush draw on the flop and villain bets. Why use ×2, not ×4?
        back_md: Unless you're all-in, you only get **one card** for this price. Villain can bet again on the turn.

  # ---------------------------------------------------------------- 5
  - slug: preflop-equities
    section: 5
    name: Preflop Equities
    description: Standard all-in matchups and dealing probabilities.
    lesson_md: |
      ## Five matchups cover most all-ins
      | Matchup | Example | Equity |
      |---|---|---|
      | Pair vs two overcards | 99 vs AK | ≈ 55/45 |
      | Pair vs one over, one under | 99 vs A5 | ≈ 70/30 |
      | Overpair vs underpair | KK vs 88 | ≈ 80/20 |
      | Dominated (shared card) | AK vs AQ | ≈ 70–75/25–30 |
      | Two overs vs two unders | AK vs 87 | ≈ 60/40 |

      **AA vs a random hand ≈ 85%.** Suited hands gain about **2–3%**; connected hands gain a little more against pairs because of straights.

      ## How often things happen
      - Dealt any pocket pair: **1 in 17** (≈ 6%). AA: **1 in 221**.
      - A pair flops a set or better: **≈ 12%**, 1 in 8.5.
      - Suited cards flop a flush draw **≈ 11%**, a flush **< 1%**.
      - An unpaired hand pairs on the flop **≈ 32%**.

      ## Set mining
      Calling a raise with a small pair just to flop a set. You hit 1 time in 8.5, so the times you hit must pay for the 7.5 misses *and then some*: you want the **effective stack ≥ 15–20× the call**.

      **Worked example:** villain raises to 3bb, effective stack 100bb → 33× → call. Villain has only 40bb → 13× → usually fold.
    cards:
