  # ---------------------------------------------------------------- 1
  - slug: number-fluency
    section: 1
    name: Number Fluency
    description: Ratios, percentages and the bet-size table.
    lesson_md: |
      ## Why this section matters
      Almost every decision at the table comes down to comparing two numbers. Most of those numbers depend only on **bet size as a fraction of the pot**, so you can memorise them once.

      ## Odds ↔ percentages
      Odds of **a : 1 against** means you win 1 time for every *a* losses:

      **win % = 1 / (a + 1)**. So 3:1 → 1/4 = **25%**, 4:1 → **20%**, 2:1 → **33%**.

      ## The three numbers for every bet size
      Villain bets **B** into a pot of **P**:
      - **Call equity**: B / (P + 2B). Your call divided by the final pot.
      - **Bluff breakeven**: B / (P + B). How often a pure bluff of size B must work.
      - **MDF** (minimum defense frequency): P / (P + B). How often you must continue so villain can't profit by bluffing any two cards.

      ## Memorise this table
      | Bet | Call needs | Bluff must work | MDF |
      |---|---|---|---|
      | ⅓ pot | 20% | 25% | 75% |
      | ½ pot | 25% | 33% | 67% |
      | ⅔ pot | 29% | 40% | 60% |
      | ¾ pot | 30% | 43% | 57% |
      | Pot | 33% | 50% | 50% |
      | 2× pot | 40% | 67% | 33% |

      **Worked example:** $50 into $100 is ½ pot → you need **25%** equity to call.

      **Live tip:** first turn the dollars into a fraction ($65 into $100 ≈ ⅔), then read the table.
