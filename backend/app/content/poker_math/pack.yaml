  # ---------------------------------------------------------------- 3
  - slug: outs-and-draws
    section: 3
    name: Outs & Draws
    description: Counting outs and converting them to equity.
    lesson_md: |
      ## Outs
      An **out** is an unseen card that should give you the best hand. Count only the cards you can't see: **47** on the flop, **46** on the turn.

      | Draw | Outs |
      |---|---|
      | Flush draw | 9 |
      | Open-ended straight draw | 8 |
      | Gutshot | 4 |
      | Two overcards | 6 (often dirty) |
      | Flush draw + open-ender | 15 |
      | Flush draw + gutshot | 12 |

      Combo draws are **not** simply added: the straight cards of your suit are already counted in the flush.

      ## Dirty outs
      An out is **dirty** if it also improves villain to a better hand. Against a set, any flush card that pairs the board gives villain a full house. Don't count it.

      ## Rule of 2 and 4
      - **Flop, all-in (two cards to come):** equity ≈ outs × 4. Over 8 outs, subtract (outs − 8): 15 outs → 60 − 7 = **53%** (exact 54%).
      - **One card to come:** equity ≈ outs × 2. On the turn, or on the flop when villain can still bet the turn.

      **Worked example:** Flush draw on the flop, all-in: 9 × 4 = 36% (exact 35%). Facing a turn bet: 9 × 2 = 18% (exact 19.6%).
