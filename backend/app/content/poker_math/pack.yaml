        kind: static
        target_ms: 8000
        front_md: What do **low / medium / high SPR** mean for top pair?
        back_md: |
          **< 4:** usually committed. Get it in.
          **4–10:** depends on the board and villain.
          **> 10:** top pair is a bluff-catcher for big pots.

  # ---------------------------------------------------------------- 9
  - slug: expected-value
    section: 9
    name: Expected Value
    description: Probability × outcome, summed.
    lesson_md: |
      ## EV = Σ (probability × outcome)
      The average result if the spot repeated forever. Everything in the earlier sections is a special case.

      ## Calling all-in
      **EV = equity × final pot − call**. The pot already includes villain's bet.

      Pot $100, villain shoves $100, you call $100 with 40%: 0.40 × $300 − $100 = **+$20**.

      ## Pure bluff
      **EV = fold% × pot − (1 − fold%) × bet**.

      Bet $50 into $100, villain folds 40%: 0.4 × 100 − 0.6 × 50 = **+$10**.

      ## Semi-bluff shove
      You win the pot when villain folds, and still have equity when called:

      EV = F × pot + (1 − F) × [equity × (pot + 2 × stack) − stack]

      Set EV = 0 and solve for **F**, the fold frequency you need. With a big draw you often need far fewer folds than a pure bluff, which is why aggressive draws are profitable.

      **Shortcut:** first ask "is it +EV when called?" If yes, shove. If not, how often must he fold?
    cards:
      - {slug: ev-call, kind: generator, answer_type: bucket, generator_key: ev_call, target_ms: 25000}
      - {slug: ev-bluff, kind: generator, answer_type: bucket, generator_key: ev_bluff, target_ms: 20000}
      - {slug: semi-bluff-fold-equity, kind: generator, answer_type: bucket, generator_key: semi_bluff_fold_equity, target_ms: 30000}
