      - {slug: fact-ev-bluff, kind: static, target_ms: 8000, front_md: "EV of a pure bluff?", back_md: "**fold% × pot − (1 − fold%) × bet**"}

  # ---------------------------------------------------------------- capstone
  - slug: mixed-spots
    section: 11
    name: Mixed Spots
    description: Real hands chaining several skills.
    lesson_md: |
      ## Putting it together
      Real decisions chain two or three skills. Work them in order and say each number out loud:

      1. **What's the price?** call ÷ final pot (section 4), or the bluff-breakeven / MDF table (section 6).
      2. **What do I have?** Outs → equity (section 3), or count combos in villain's range (section 2).
      3. **What's behind?** Effective stack and SPR (section 8). Is it all-in, or will there be more betting (implied odds, section 7)?
      4. **Compare and decide.** If it's close, the tiebreaker is usually future money: implied or reverse implied odds.

      **Worked example: river bluff-catch.** Villain bets pot. You need 33%. His range: {sets: 6 combos, two pair: 3} for value, {missed flush draws: 12} as bluffs. You beat 12 of 21 = 57% → **call**.

      **Worked example: flop shove.** Villain shoves 1.5× pot. You need 1.5 / 4 = 37.5%. You have a combo draw, 15 outs → ≈ 54% with two cards to come → **call**.
    cards:
      - {slug: spot-draw-call, kind: generator, answer_type: action, generator_key: spot_draw_call, target_ms: 30000}
      - {slug: spot-river-bluffcatch, kind: generator, answer_type: action, generator_key: spot_river_bluffcatch, target_ms: 30000}
      - {slug: spot-flop-commit, kind: generator, answer_type: choice, generator_key: spot_flop_commit, target_ms: 35000}
      - {slug: spot-set-mine, kind: generator, answer_type: action, generator_key: spot_set_mine, target_ms: 25000}
