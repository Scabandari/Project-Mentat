  # ---------------------------------------------------------------- 2
  - slug: combinatorics
    section: 2
    name: Combinatorics
    description: Counting hand combinations and card removal.
    lesson_md: |
      ## Combos
      There are **1,326** two-card starting hands, but only **169** strategically different ones.

      | Hand type | Combos | Why |
      |---|---|---|
      | Pocket pair (QQ) | 6 | C(4,2): choose 2 of 4 queens |
      | Suited (AKs) | 4 | one per suit |
      | Offsuit (AKo) | 12 | 4 × 4 − 4 suited |
      | Any suits (AK) | 16 | 4 × 4 |

      ## Card removal
      Every card you can see (board and your hand) is one villain can't have.
      - One ace on board: AA goes from 6 → **3** combos (C(3,2)), AK from 16 → **12** (3 × 4).
      - **Sets** of an unpaired board card: **3** combos each. **Two pair** using both hole cards: **3 × 3 = 9** per pair of board ranks.

      ## Blockers
      If you hold a card villain needs, you **block** those combos. Holding the A♠ on a three-spade board means villain can never have the nut flush.

      **Worked example:** Board K♠ 7♦ 2♣. Villain's range {AA, KK}: AA 6 + KK 3 = **9 combos**.

      **Shortcut:** pairs → C(cards left, 2). Unpaired → cards left of rank 1 × cards left of rank 2.
    cards:
