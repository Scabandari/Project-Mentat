    section: 6
    name: Betting Math
    description: What your bets require. Bluffs, defense, value-to-bluff ratios.
    lesson_md: |
      ## The other side of pot odds
      Pot odds tell you when to **call**. Betting math tells you what your **bets** need, and how often you must **defend**.

      ## Bluff breakeven
      You bet **B** into **P** with nothing. You risk B to win P:

      **fold% needed = B / (P + B)**. Half pot needs 33% folds; pot needs 50%.

      ## Minimum defense frequency (MDF)
      **MDF = P / (P + B)**. If you fold more often than 1 − MDF, villain profits by betting any two cards. Facing a pot-size bet you must continue **50%** of the time.

      ## Value-to-bluff ratio
      On the river, a polarised range (nuts or air) should contain bluffs in the same proportion as villain's **call equity**: **B / (P + 2B)**.
      - ½ pot → 25% bluffs (3 value : 1 bluff)
      - Pot → 33% bluffs (2 : 1)
      - 2× pot → 40% bluffs (3 : 2)

      Bigger bets can carry more bluffs, but each bluff must work more often.

      **Worked example:** you bet $60 into $100. Villain must fold 60 / 160 = **37.5%** for a bluff to profit. If you think he folds half the time, bluff.
    cards:
      - {slug: bluff-breakeven, kind: generator, answer_type: bucket, generator_key: bluff_breakeven, target_ms: 10000}
      - {slug: mdf, kind: generator, answer_type: bucket, generator_key: mdf, target_ms: 10000}
      - {slug: value-bluff-ratio, kind: generator, answer_type: bucket, generator_key: value_bluff_ratio, target_ms: 12000}
      - {slug: bluff-or-check, kind: generator, answer_type: choice, generator_key: bluff_or_check, target_ms: 20000}
      - slug: fact-value-bluff-ratio
        kind: static
        target_ms: 8000
        front_md: On the river you bet **pot**. What share of your betting range can be bluffs?
        back_md: "**33%** (2 value : 1 bluff), the same number as villain's required call equity: B / (P + 2B)."

  # ---------------------------------------------------------------- 7
  - slug: implied-odds
    section: 7
    name: Implied Odds
    description: Paying now for money you'll win later.
    lesson_md: |
      ## Implied odds
      Sometimes the price is wrong *now* but right once you count the money you'll win **later** when you hit.

      **Extra you need = call ÷ equity − (pot + bet + call)**

      **Worked example:** pot $100, villain bets $50, you have a flush draw (9 outs, ≈ 19% for one card). Direct odds need 25%.

      $50 ÷ 0.19 = $263. Minus the $200 that will be in the pot: you need to win about **$63 more** on later streets when you hit. Against a deep opponent who pays off, that's easy; against a short stack, it's impossible.

      ## What makes implied odds good
      - Deep effective stacks (there's money left to win).
      - **Disguised** draws, like gutshots or sets, that villain won't see coming.
      - An opponent who calls too much.

      ## Reverse implied odds
      Some draws **hit and still lose**, and lose a big pot. Classic examples:
      - **Low flush draws**: any higher flush beats you.
      - The **ignorant end** of a straight: you make the low straight while villain makes the high one.
      - Weak top pair against a tight opponent who only continues when he beats it.

      Prefer draws to the **nuts**.
    cards:
      - {slug: implied-required, kind: generator, answer_type: bucket, generator_key: implied_required, target_ms: 25000}
      - {slug: implied-call, kind: generator, answer_type: action, generator_key: implied_call, target_ms: 30000}
      - {slug: reverse-implied, kind: generator, answer_type: choice, generator_key: reverse_implied, target_ms: 15000}
      - slug: fact-implied-formula
        kind: static
        target_ms: 10000
        front_md: How much extra must you win later to justify a call with equity **E**?
        back_md: "**call / E − (pot + call)**, where pot includes villain's bet."

  # ---------------------------------------------------------------- 8
  - slug: stack-geometry
    section: 8
    name: Stack Geometry
    description: Stack-to-pot ratio, commitment and multi-street sizing.
    lesson_md: |
      ## Effective stack
      The **smaller** of the two stacks. It's the most either player can win or lose. Your $2,000 doesn't matter against a $300 stack.

      ## SPR: stack-to-pot ratio
      **SPR = effective stack ÷ pot** at the start of the flop.

      | SPR | Meaning with top pair |
      |---|---|
      | Under 4 | Usually committed: get it in |
      | 4–10 | Depends on board and opponent |
      | Over 10 | One pair is a bluff-catcher; stack off only with strong hands |

      SPR is decided **preflop**: a 3-bet pot with 100bb stacks often has an SPR around 4; a limped pot can be 30+.

      ## Geometric bet sizing
      To get all-in by the river with the same-size bet each street: each called bet of **f × pot** multiplies the pot by **(1 + 2f)**. So

      **(1 + 2f)^streets = (pot + 2 × stack) / pot**

      **Worked example:** pot 10bb, 95bb behind, three streets. Final pot 200bb = 20× today's. 20^(1/3) ≈ 2.71 → f ≈ **86% pot** each street.

      **Shortcut:** SPR ≈ 1 → one pot-size bet. SPR ≈ 4 → two streets of pot. SPR ≈ 13 → three streets of pot.
    cards:
      - {slug: spr-calc, kind: generator, answer_type: bucket, generator_key: spr_calc, target_ms: 8000}
      - {slug: spr-classify, kind: generator, answer_type: choice, generator_key: spr_classify, target_ms: 8000}
      - {slug: geometric-sizing, kind: generator, answer_type: bucket, generator_key: geometric_sizing, target_ms: 25000}
      - {slug: effective-stack, kind: generator, answer_type: bucket, generator_key: effective_stack, target_ms: 8000}
      - {slug: fact-spr-def, kind: static, target_ms: 5000, front_md: "What is **SPR**?", back_md: "**Effective stack ÷ pot** on the flop."}
      - {slug: fact-effective-stack, kind: static, target_ms: 5000, front_md: "What is the **effective stack**?", back_md: "The **smaller** of the two stacks. It's the most either player can win or lose."}
