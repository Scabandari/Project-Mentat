# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d   (make prod-up)
name: mentat-prod

services:
  db:
    ports: !reset []

  api:
    build:
      target: prod
    volumes: !reset []
    ports: !reset []
    environment:
      APP_ENV: prod

  web:
    profiles: ["dev-only"]

  nginx:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
